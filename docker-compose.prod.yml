# Stack de produção — Central da Manada (VPS Hostinger).
# Sobe: caddy (reverse proxy + TLS) -> web (Next.js) + api (NestJS) -> postgres + redis.
# Só o caddy publica portas para a internet (80/443). Banco e Redis ficam apenas
# na rede interna do Docker.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# Variáveis vêm de .env.production (NÃO versionado). Ver .env.production.example.

services:
  caddy:
    image: caddy:2-alpine
    container_name: cdm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Sites de outros sistemas da VPS (ex.: Fazenda), importados no fim do
      # Caddyfile. Fica fora do repo para o git pull não mexer. Pré-requisito
      # criado uma vez no servidor — ver docs/deploy.md ("Proxy compartilhado").
      - /srv/caddy-sites:/etc/caddy/sites:ro
    depends_on:
      - web
      - api
    networks:
      - cdm
      # Rede externa onde os outros sistemas expõem seus containers ao Caddy.
      # Só o caddy entra nela; api/web/postgres/redis seguem isolados na `cdm`.
      - proxy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Embutido no bundle do Next em build-time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cdm-web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - cdm

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cdm-api
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cdm

  postgres:
    image: postgres:16-alpine
    container_name: cdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdm

  redis:
    image: redis:7-alpine
    container_name: cdm-redis
    restart: unless-stopped
    # AUTH obrigatório mesmo o Redis estando só na rede interna `cdm`: defesa em
    # profundidade — sem senha, qualquer container que alcance a rede lê/escreve o
    # throttle de login e o cache. REDIS_PASSWORD é OBRIGATÓRIA em .env.production;
    # sem ela o container sobe sem senha e a API (que manda AUTH) falha ao conectar.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdm

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  cdm:
    driver: bridge
  # Criada fora do compose (`docker network create proxy`); sem ela o `up` falha.
  proxy:
    external: true
