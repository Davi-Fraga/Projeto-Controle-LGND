# Stack de produção — Central da Manada (VPS Hostinger).
# Sobe: caddy (reverse proxy + TLS) -> web (Next.js) + api (NestJS) -> postgres + redis.
# Só o caddy publica portas para a internet (80/443). Banco e Redis ficam apenas
# na rede interna do Docker.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# Variáveis vêm de .env.production (NÃO versionado). Ver .env.production.example.

services:
  caddy:
    image: caddy:2-alpine
    container_name: cdm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - cdm

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Embutido no bundle do Next em build-time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cdm-web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - cdm

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cdm-api
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cdm

  postgres:
    image: postgres:16-alpine
    container_name: cdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdm

  redis:
    image: redis:7-alpine
    container_name: cdm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdm

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  cdm:
    driver: bridge
