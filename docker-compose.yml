services:
  postgres:
    image: postgres:16-alpine
    container_name: central-da-manada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-central}
      POSTGRES_DB: ${POSTGRES_DB:-central_da_manada}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-central} -d ${POSTGRES_DB:-central_da_manada}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
