services:
  postgres:
    image: postgres:16-alpine
    container_name: central-da-manada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-central}
      POSTGRES_DB: ${POSTGRES_DB:-central_da_manada}
    ports:
      # Loopback: a senha default de dev é fraca (`central`) — não pode ficar
      # escutando em todas as interfaces da máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-central} -d ${POSTGRES_DB:-central_da_manada}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: central-da-manada-pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-central}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-central}
      - DB_NAME=${POSTGRES_DB:-central_da_manada}
      - LISTEN_PORT=6432
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: central-da-manada-redis
    restart: unless-stopped
    ports:
      # Preso ao loopback: sem isto o Redis (sem senha, em dev) fica acessível a
      # qualquer máquina da rede local. Produção usa senha — ver docker-compose.prod.yml.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
