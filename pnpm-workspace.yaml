packages:
  - "apps/*"
  - "packages/*"

# Advisories que chegam só como dependência transitiva de @nestjs/* e do Next —
# não há upgrade direto que os feche. São bumps patch/minor dentro da mesma major.
#
# DUPLICADO de propósito com `pnpm.overrides` do package.json da raiz: pnpm 9 (a
# versão pinada em `packageManager`) lê o campo do package.json; pnpm 10+ lê SÓ
# daqui e ignora o outro em silêncio. Manter os dois evita que um `pnpm install`
# feito com a versão "errada" reintroduza as versões vulneráveis sem aviso.
# Ao alterar um, alterar o outro.
overrides:
  multer: ">=2.2.0"
  lodash: ">=4.18.0"
  postcss: ">=8.5.18"
  qs: ">=6.15.2"
  body-parser: ">=1.20.6"
